name: Nightly search catalog
on:
  schedule:
    - cron: '23 0 * * *'   # every night 02:23 Israel time (winter)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build catalog from Konimbo API
        env:
          KONIMBO_TOKEN: ${{ secrets.KONIMBO_TOKEN }}
        run: node build.js
      - name: Publish (only after a successful build)
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add catalog.json status.json
          git diff --cached --quiet || (git commit -m "nightly catalog $(date -u +%F)" && git push)
          curl -s "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/catalog.json" > /dev/null || true
